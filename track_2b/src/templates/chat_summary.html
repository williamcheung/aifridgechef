<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px 40px;
            background-color: #fff;
            color: #292621;
        }
        .summary-title {
            color: #c0392b;
            font-size: 2.4em;
            margin-bottom: 0.5em;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 0.5em;
        }
        .summary-content {
            max-width: 820px;
            margin: 0 auto;
        }
        .summary-content h1,
        .summary-content h2,
        .summary-content h3 {
            color: #555;
            margin-top: 1.5em;
            margin-bottom: 0.4em;
        }
        .summary-content h2 { font-size: 1.6em; }
        .summary-content h3 { font-size: 1.25em; }
        .summary-content ul,
        .summary-content ol {
            padding-left: 1.5em;
        }
        .summary-content li { margin-bottom: 0.35em; }
        .summary-content p { margin: 0.6em 0; }
        .summary-content a {
            color: #007bff;
            text-decoration: none;
        }
        .summary-content a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1 class="summary-title">{{ title }}</h1>
    <div class="summary-content">
        {{ summary_html | safe }}
    </div>
</body>
</html>
